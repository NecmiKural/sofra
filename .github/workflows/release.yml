name: Release

# Tag a commit to ship it:  git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          body: |
            **Live demo** — https://sofra-demo.onrender.com

            ```bash
            docker run -d -p 3000:3000 -v sofra-data:/app/data \
              -e SESSION_SECRET="$(openssl rand -hex 32)" \
              ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ```

      # Optional: add a RENDER_DEPLOY_HOOK secret to redeploy the demo on release.
      - name: Redeploy demo
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -n "$HOOK" ]; then
            curl -fsS "$HOOK" > /dev/null && echo "Demo redeploy triggered."
          else
            echo "RENDER_DEPLOY_HOOK not set — skipping demo redeploy."
          fi
